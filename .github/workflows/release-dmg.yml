name: Release DMG

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to rebuild and release (for example, v0.1.1)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  # A tag may be retried after a build failure, but two runs for the same tag
  # must never package or publish concurrently.
  group: tidytap-release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 90
    environment:
      name: release
    env:
      TIDYTAP_KEYCHAIN_PATH: ${{ runner.temp }}/tidytap-release.keychain-db
      TIDYTAP_NOTARYTOOL_KEYCHAIN_PATH: ${{ runner.temp }}/tidytap-release.keychain-db
      TIDYTAP_KEYCHAIN_PASSWORD_FILE: ${{ runner.temp }}/tidytap-release-keychain-password
      TIDYTAP_CERTIFICATE_PATH: ${{ runner.temp }}/tidytap-developer-id.p12
      TIDYTAP_NOTARY_KEY_PATH: ${{ runner.temp }}/tidytap-notary-key.p8
      TIDYTAP_NOTARY_PROFILE: tidytap-ci-notary
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Validate tag, main ancestry, version, and runner
        id: metadata
        shell: zsh {0}
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          if [[ ! "$tag" =~ '^v[0-9]+\.[0-9]+\.[0-9]+$' ]]; then
            print -u2 -- "Release tag must match vMAJOR.MINOR.PATCH: $tag"
            exit 1
          fi

          git fetch --no-tags origin main
          tag_commit="$(git rev-parse "$tag^{commit}")"
          if ! git merge-base --is-ancestor "$tag_commit" origin/main; then
            print -u2 -- "Release tag $tag does not point to a commit contained in origin/main."
            exit 1
          fi

          sdk_version="$(xcrun --sdk macosx --show-sdk-version)"
          sdk_major="${sdk_version%%.*}"
          [[ "$(uname -m)" == "arm64" ]]
          (( sdk_major >= 26 ))

          marketing_version="$(xcodebuild -project TidyTap.xcodeproj -scheme TidyTap -configuration Release -showBuildSettings CODE_SIGNING_ALLOWED=NO | awk -F ' = ' '$1 ~ /MARKETING_VERSION$/ { print $2; exit }')"
          tag_version="${tag#v}"
          if [[ -z "$marketing_version" || "$marketing_version" != "$tag_version" ]]; then
            print -u2 -- "Tag $tag does not match MARKETING_VERSION ($marketing_version)."
            exit 1
          fi

          print "tag=$tag" >> "$GITHUB_OUTPUT"
          print "tag_commit=$tag_commit" >> "$GITHUB_OUTPUT"
          print "version=$tag_version" >> "$GITHUB_OUTPUT"
          print "sdk_version=$sdk_version" >> "$GITHUB_OUTPUT"
          xcodebuild -version
          printf 'Release tag %s resolves to main commit %s; app version %s; macOS SDK %s.\n' "$tag" "$tag_commit" "$tag_version" "$sdk_version"

      - name: Prepare temporary signing keychain
        shell: zsh {0}
        env:
          TIDYTAP_DEVELOPMENT_TEAM: ${{ secrets.TIDYTAP_DEVELOPMENT_TEAM }}
          TIDYTAP_DEVELOPER_ID_APPLICATION: ${{ secrets.TIDYTAP_DEVELOPER_ID_APPLICATION }}
          TIDYTAP_CERTIFICATE_BASE64: ${{ secrets.TIDYTAP_DEVELOPER_ID_CERTIFICATE_P12_BASE64 }}
          TIDYTAP_CERTIFICATE_PASSWORD: ${{ secrets.TIDYTAP_DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          TIDYTAP_NOTARY_KEY_BASE64: ${{ secrets.TIDYTAP_NOTARY_API_KEY_P8_BASE64 }}
          TIDYTAP_NOTARY_KEY_ID: ${{ secrets.TIDYTAP_NOTARY_KEY_ID }}
          TIDYTAP_NOTARY_ISSUER_ID: ${{ secrets.TIDYTAP_NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          umask 077
          for value in \
            "$TIDYTAP_DEVELOPMENT_TEAM" \
            "$TIDYTAP_DEVELOPER_ID_APPLICATION" \
            "$TIDYTAP_CERTIFICATE_BASE64" \
            "$TIDYTAP_CERTIFICATE_PASSWORD" \
            "$TIDYTAP_NOTARY_KEY_BASE64" \
            "$TIDYTAP_NOTARY_KEY_ID" \
            "$TIDYTAP_NOTARY_ISSUER_ID"; do
            [[ -n "$value" ]]
          done

          /usr/bin/openssl rand -base64 48 > "$TIDYTAP_KEYCHAIN_PASSWORD_FILE"
          keychain_password="$(<"$TIDYTAP_KEYCHAIN_PASSWORD_FILE")"
          security create-keychain -p "$keychain_password" "$TIDYTAP_KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$TIDYTAP_KEYCHAIN_PATH"
          security unlock-keychain -p "$keychain_password" "$TIDYTAP_KEYCHAIN_PATH"

          /usr/bin/base64 -D -i <(printf '%s' "$TIDYTAP_CERTIFICATE_BASE64") -o "$TIDYTAP_CERTIFICATE_PATH"
          security import "$TIDYTAP_CERTIFICATE_PATH" \
            -k "$TIDYTAP_KEYCHAIN_PATH" \
            -P "$TIDYTAP_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security \
            -T /usr/bin/xcodebuild
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$TIDYTAP_KEYCHAIN_PATH"
          security list-keychains -d user -s "$TIDYTAP_KEYCHAIN_PATH" "$HOME/Library/Keychains/login.keychain-db"

          /usr/bin/base64 -D -i <(printf '%s' "$TIDYTAP_NOTARY_KEY_BASE64") -o "$TIDYTAP_NOTARY_KEY_PATH"
          xcrun notarytool store-credentials "$TIDYTAP_NOTARY_PROFILE" \
            --key "$TIDYTAP_NOTARY_KEY_PATH" \
            --key-id "$TIDYTAP_NOTARY_KEY_ID" \
            --issuer "$TIDYTAP_NOTARY_ISSUER_ID" \
            --keychain "$TIDYTAP_KEYCHAIN_PATH"

          printf '%s\n' \
            "TIDYTAP_DEVELOPMENT_TEAM = $TIDYTAP_DEVELOPMENT_TEAM" \
            "TIDYTAP_DEVELOPER_ID_APPLICATION = $TIDYTAP_DEVELOPER_ID_APPLICATION" \
            "TIDYTAP_NOTARYTOOL_KEYCHAIN_PROFILE = $TIDYTAP_NOTARY_PROFILE" \
            > Config/LocalSigning.xcconfig

      - name: Build, sign, notarize, and staple DMG
        shell: zsh {0}
        run: |
          set -euo pipefail
          rm -rf build
          Scripts/package-release-dmg.sh

      - name: Verify DMG contents and checksum
        shell: zsh {0}
        env:
          RELEASE_VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          set -euo pipefail
          artifact_dir="build/artifacts/TidyTap-$RELEASE_VERSION"
          Scripts/verify-release-artifact.sh \
            "$artifact_dir/TidyTap-$RELEASE_VERSION.dmg" \
            "$RELEASE_VERSION"

      - name: Publish draft GitHub Release
        shell: zsh {0}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.metadata.outputs.tag }}
          RELEASE_VERSION: ${{ steps.metadata.outputs.version }}
          RELEASE_COMMIT: ${{ steps.metadata.outputs.tag_commit }}
          RELEASE_SDK: ${{ steps.metadata.outputs.sdk_version }}
        run: |
          set -euo pipefail
          artifact_dir="build/artifacts/TidyTap-$RELEASE_VERSION"
          notes_file="$RUNNER_TEMP/tidytap-release-notes.md"
          printf '%s\n' \
            "TidyTap $RELEASE_VERSION" \
            "" \
            "Built from main commit \`$RELEASE_COMMIT\` via tag \`$RELEASE_TAG\`." \
            "The DMG was produced by the repository release script and passed signature, notarization, stapling, Gatekeeper, checksum, and bundle-content checks on a GitHub-hosted arm64 runner (macOS SDK $RELEASE_SDK)." \
            > "$notes_file"

          # Keep the release private while both assets upload. A failed upload
          # leaves a draft that a later run can resume. Asset replacement is
          # allowed only while the release remains a draft.
          if gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft' >/dev/null 2>&1; then
            is_draft="$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft')"
            if [[ "$is_draft" != "true" ]]; then
              print -u2 -- "Release $RELEASE_TAG is already published; refusing to overwrite it."
              exit 1
            fi
            gh release edit "$RELEASE_TAG" \
              --title "TidyTap $RELEASE_VERSION" \
              --notes-file "$notes_file"
          else
            gh release create "$RELEASE_TAG" \
              --verify-tag \
              --draft \
              --title "TidyTap $RELEASE_VERSION" \
              --notes-file "$notes_file"
          fi
          gh release upload "$RELEASE_TAG" \
            "$artifact_dir/TidyTap-$RELEASE_VERSION.dmg" \
            "$artifact_dir/TidyTap-$RELEASE_VERSION.dmg.sha256" \
            --clobber
          gh release edit "$RELEASE_TAG" --draft=false

      - name: Clean temporary signing material
        if: ${{ always() }}
        shell: zsh {0}
        run: |
          set +e
          if [[ -f "$TIDYTAP_KEYCHAIN_PASSWORD_FILE" && -f "$TIDYTAP_KEYCHAIN_PATH" ]]; then
            keychain_password="$(<"$TIDYTAP_KEYCHAIN_PASSWORD_FILE")"
            security unlock-keychain -p "$keychain_password" "$TIDYTAP_KEYCHAIN_PATH" >/dev/null 2>&1
            security delete-keychain "$TIDYTAP_KEYCHAIN_PATH" >/dev/null 2>&1
          fi
          rm -f \
            "$TIDYTAP_KEYCHAIN_PASSWORD_FILE" \
            "$TIDYTAP_CERTIFICATE_PATH" \
            "$TIDYTAP_NOTARY_KEY_PATH" \
            "$RUNNER_TEMP/tidytap-release-notes.md" \
            Config/LocalSigning.xcconfig
